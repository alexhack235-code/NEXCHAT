<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEX 3D Studio — 3D Animated Website Generator & Aerocar Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #050308;
      --panel-bg: #080510;
      --card-bg: #0f0c1c;
      --border: #1a1726;
      --border-focus: #2d2645;
      --cyan: #00F0FF;
      --magenta: #FF007F;
      --green: #00FF88;
      --yellow: #FFE600;
      --purple: #7000FF;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 6, 14, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #000;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }
    .main-stage {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .left-panel {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .center-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #020005;
      position: relative;
    }
    .right-panel {
      width: 430px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-focus);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }
    .chip {
      background: #130f24;
      border: 1px solid #2a2347;
      color: #c4b5fd;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover {
      background: var(--purple);
      color: #fff;
      border-color: var(--cyan);
    }
    .btn-generate {
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(112, 0, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 240, 255, 0.5);
    }
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #three-container {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(4, 2, 10, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      z-index: 5;
    }
    .hud-cam-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 6px;
      background: rgba(8, 6, 16, 0.88);
      backdrop-filter: blur(10px);
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .cam-btn {
      background: #181329;
      color: #c4b5fd;
      border: 1px solid #2f2747;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cam-btn:hover {
      background: #271f42;
      color: #fff;
    }
    .cam-btn.active {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .variants-bar {
      height: 140px;
      border-top: 1px solid var(--border);
      background: rgba(8, 6, 14, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
    }
    .variant-card {
      width: 220px;
      height: 105px;
      background: var(--card-bg);
      border: 1px solid #231f38;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .variant-card.active {
      border: 2px solid var(--cyan);
      background: rgba(0, 240, 255, 0.08);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
    }
    .code-viewer {
      flex: 1;
      padding: 14px;
      overflow: auto;
      background: #050309;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #a5b4fc;
      white-space: pre;
    }
    .btn-export {
      background: linear-gradient(135deg, var(--cyan), #0077FE);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="logo-badge">N3</div>
      <div>
        <div style="font-size:15px; font-weight:800; letter-spacing:0.5px; background:linear-gradient(90deg, #fff, #a1a1aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
          NEX 3D STUDIO
        </div>
        <div style="font-size:10px; color:var(--cyan); font-weight:600; letter-spacing:1px;">
          RUST AXUM BACKEND • LIVE WEBGL 3D WORLD SIMULATION
        </div>
      </div>
    </div>

    <!-- Status indicator -->
    <div style="display:flex; align-items:center; gap:10px; font-size:12px; background:#0e0b17; padding:6px 14px; border-radius:20px; border:1px solid #272238;">
      <div id="statusDot" style="width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green);"></div>
      <span id="statusLabel" style="color:var(--text-muted);">60 FPS Aerocar Simulation Active</span>
      <span id="timeLabel" style="color:var(--cyan); font-weight:700; padding-left:6px; border-left:1px solid #373349;">&lt;3s Ready</span>
    </div>

    <button class="btn-export" onclick="openExportModal()">
      Export Code (Next.js + Vite)
    </button>
  </header>

  <div class="main-stage">
    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <div>
        <label style="font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:8px; display:block;">
          Prompt to 3D World
        </label>
        <textarea id="promptInput" rows="4">Create a cyberpunk city landing page with flying cars</textarea>
      </div>

      <div>
        <div style="font-size:11px; font-weight:600; color:var(--text-dim); margin-bottom:8px;">
          QUICK ARCHITECTURES:
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button class="chip" onclick="applyPreset('Cyberpunk City', 'Create a cyberpunk city landing page with flying cars and neon fog')">Cyberpunk City</button>
          <button class="chip" onclick="applyPreset('Luxury Watch', 'Luxury diamond watch rotating 360 on black marble pedestal with studio lighting')">Luxury Watch</button>
          <button class="chip" onclick="applyPreset('Gaming Portal', 'Low-poly quantum portal floating in space with dodecahedron crystal core')">Gaming Portal</button>
          <button class="chip" onclick="applyPreset('Music Festival', 'Electronic music festival stage with audio-reactive pulsating neon strobe rings')">Music Festival</button>
          <button class="chip" onclick="applyPreset('Abstract Portfolio', 'Abstract kinetic morphing liquid blob with gyroscope neon rings')">Abstract Portfolio</button>
        </div>
      </div>

      <button class="btn-generate" onclick="generate3D()">
        ⚡ Generate 3D Website (&lt;3s)
      </button>

      <!-- Video to 3D TikTok Remix -->
      <div style="border-top:1px solid var(--border); padding-top:14px; display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:700; color:var(--magenta);">🎬 NEX Reels: Video to 3D</span>
          <span style="font-size:10px; background:#350020; color:var(--magenta); padding:2px 6px; border-radius:4px;">AI VISION</span>
        </div>
        <input type="text" id="videoUrlInput" placeholder="Paste TikTok / Reel link..." />
        <button style="background:linear-gradient(135deg, var(--magenta), var(--purple)); color:#fff; font-weight:700; font-size:12px; padding:9px; border-radius:8px; border:none; cursor:pointer;" onclick="remixWithAI()">
          🪄 Remix with AI
        </button>
      </div>
    </aside>

    <!-- CENTER STAGE -->
    <main class="center-stage">
      <div class="viewport">
        <div class="hud-badge" id="hudBadge">60 FPS WEBGL • CYBERPUNK AEROCAR TRAFFIC SIMULATION</div>
        <div class="hud-cam-bar">
          <button class="cam-btn active" id="camOrbitBtn" onclick="setCameraMode('orbit')">🎥 Orbit</button>
          <button class="cam-btn" id="camChaseBtn" onclick="setCameraMode('chase')">🏎️ Chase Car</button>
          <button class="cam-btn" id="camFlyBtn" onclick="setCameraMode('flythrough')">🏙️ Canyon Flyby</button>
        </div>
        <div id="three-container"></div>
      </div>

      <!-- Midjourney 3 Variants Grid -->
      <div class="variants-bar">
        <div style="font-size:11px; font-weight:800; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; writing-mode:vertical-rl; transform:rotate(180deg);">
          VARIANTS
        </div>
        <div id="variantsContainer" style="display:flex; gap:14px; flex:1; overflow-x:auto;">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">
      <!-- Leva Controls -->
      <div style="padding:14px 18px; border-bottom:1px solid var(--border); background:#0c0817;">
        <div style="font-size:11px; font-weight:800; color:var(--cyan); letter-spacing:1px; margin-bottom:10px; text-transform:uppercase;">
          ⚙️ Leva Scene Controls
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:11px;">
          <div>
            <label style="display:block; color:var(--text-muted); margin-bottom:4px;">Vehicle Speed</label>
            <input type="range" id="carSpeedSlider" min="0.2" max="3.5" step="0.1" value="1.2" oninput="updateCarSpeed(this.value)" style="width:100%;">
          </div>
          <div>
            <label style="display:block; color:var(--text-muted); margin-bottom:4px;">Aerocar Traffic</label>
            <input type="range" id="trafficSlider" min="1" max="8" step="1" value="5" oninput="updateTrafficCount(this.value)" style="width:100%;">
          </div>
          <div>
            <label style="display:block; color:var(--text-muted); margin-bottom:4px;">Light Intensity</label>
            <input type="range" id="lightSlider" min="0.1" max="3" step="0.1" value="1.6" oninput="updateLight(this.value)" style="width:100%;">
          </div>
          <div>
            <label style="display:block; color:var(--text-muted); margin-bottom:4px;">Neon Glow Intensity</label>
            <input type="range" id="glowSlider" min="0.5" max="3.0" step="0.1" value="1.8" oninput="updateGlow(this.value)" style="width:100%;">
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="wireframeCheck" onchange="toggleWireframe(this.checked)">
            <label for="wireframeCheck" style="color:#d1d5db; cursor:pointer;">Wireframe Mode</label>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="nitroBoostCheck" onchange="toggleNitro(this.checked)">
            <label for="nitroBoostCheck" style="color:#00FF88; font-weight:700; cursor:pointer;">🚀 Nitro Afterburner</label>
          </div>
        </div>
      </div>

      <!-- Code Header -->
      <div style="padding:10px 18px; background:#0e0b1c; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:12px; font-weight:700; color:#e5e7eb;">GeneratedScene.tsx</span>
          <span style="font-size:10px; background:#064e3b; color:#34d399; padding:2px 8px; border-radius:4px; font-weight:700;">✓ VALID R3F</span>
        </div>
        <button style="background:#221b38; color:#c4b5fd; border:1px solid #373059; border-radius:6px; font-size:11px; padding:4px 10px; cursor:pointer;" onclick="copyCode()">
          Copy Code
        </button>
      </div>

      <!-- Code Viewer -->
      <div class="code-viewer" id="codeViewer"></div>
    </aside>
  </div>

  <script>
    // ------------------------------------------------------------------------
    // THREE.JS HIGH-FIDELITY SCENE ENGINE
    // ------------------------------------------------------------------------
    let scene, camera, renderer, controls;
    let worldGroup, particlesGroup, dirLight, pointLight, floorGrid;
    let flyingCars = [];
    let carSpeedMult = 1.2;
    let isWireframe = false;
    let isNitro = false;
    let cameraMode = 'orbit'; // 'orbit' | 'chase' | 'flythrough'
    let currentTheme = 'cyberpunk_city';
    let clock = new THREE.Clock();

    function initThree() {
      const container = document.getElementById('three-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020008);
      scene.fog = new THREE.FogExp2(0x050014, 0.025);

      camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 8, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;

      // Base Lighting Rig
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      dirLight = new THREE.DirectionalLight(0x00F0FF, 1.8);
      dirLight.position.set(15, 25, 10);
      scene.add(dirLight);

      pointLight = new THREE.PointLight(0xFF007F, 3.5, 50);
      pointLight.position.set(-10, 8, -5);
      scene.add(pointLight);

      // Starfield / Cyber Dust
      particlesGroup = new THREE.Group();
      const pCount = 1200;
      const pGeom = new THREE.BufferGeometry();
      const pPositions = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i += 3) {
        pPositions[i] = (Math.random() - 0.5) * 80;
        pPositions[i + 1] = Math.random() * 35;
        pPositions[i + 2] = (Math.random() - 0.5) * 80;
      }
      pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      const pMat = new THREE.PointsMaterial({ size: 0.16, color: 0x00F0FF, transparent: true, opacity: 0.8 });
      const particles = new THREE.Points(pGeom, pMat);
      particlesGroup.add(particles);
      scene.add(particlesGroup);

      // Dynamic World Container
      worldGroup = new THREE.Group();
      scene.add(worldGroup);

      // Reflective Street Grid
      floorGrid = new THREE.GridHelper(80, 80, 0x00F0FF, 0x161326);
      floorGrid.position.y = 0;
      scene.add(floorGrid);

      // Build initial Cyberpunk Flying Car Simulation
      build3DCyberpunkCity(5);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('three-container');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // ------------------------------------------------------------------------
    // PROCEDURAL FLYING CAR FACTORY (AEROCARS)
    // ------------------------------------------------------------------------
    function createFlyingCar(cfg) {
      const carGroup = new THREE.Group();

      // 1. Sleek Aerodynamic Wedge Chassis
      const bodyGeom = new THREE.BoxGeometry(1.6, 0.45, 3.6);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        metalness: 0.95,
        roughness: 0.15,
        wireframe: isWireframe
      });
      const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
      bodyMesh.position.y = 0.25;
      carGroup.add(bodyMesh);

      // 2. Cyberpunk Cockpit Canopy
      const canopyGeom = new THREE.BoxGeometry(1.1, 0.38, 1.8);
      const canopyMat = new THREE.MeshStandardMaterial({
        color: 0x00F0FF,
        emissive: 0x00F0FF,
        emissiveIntensity: 1.2,
        transparent: true,
        opacity: 0.85,
        metalness: 0.9,
        roughness: 0.1,
        wireframe: isWireframe
      });
      const canopy = new THREE.Mesh(canopyGeom, canopyMat);
      canopy.position.set(0, 0.55, -0.1);
      carGroup.add(canopy);

      // 3. Swept Aerodynamic Delta Wings
      const wingGeom = new THREE.BoxGeometry(0.7, 0.06, 1.4);
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x0d0b17, metalness: 0.9, roughness: 0.2 });
      
      const leftWing = new THREE.Mesh(wingGeom, wingMat);
      leftWing.position.set(-1.05, 0.25, -0.3);
      leftWing.rotation.y = -0.2;
      carGroup.add(leftWing);

      const rightWing = new THREE.Mesh(wingGeom, wingMat);
      rightWing.position.set(1.05, 0.25, -0.3);
      rightWing.rotation.y = 0.2;
      carGroup.add(rightWing);

      // Glowing Wingtip Runners
      const tipGeom = new THREE.BoxGeometry(0.08, 0.08, 1.2);
      const tipMat = new THREE.MeshBasicMaterial({ color: cfg.neonColor });
      const leftTip = new THREE.Mesh(tipGeom, tipMat);
      leftTip.position.set(-1.4, 0.25, -0.3);
      carGroup.add(leftTip);
      const rightTip = new THREE.Mesh(tipGeom, tipMat);
      rightTip.position.set(1.4, 0.25, -0.3);
      carGroup.add(rightTip);

      // 4. Dual Rear Plasma Thrusters
      const thrusterFlares = [];
      const engineGeom = new THREE.CylinderGeometry(0.18, 0.22, 0.5, 16);
      engineGeom.rotateX(Math.PI / 2);
      const engineMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, metalness: 0.95 });

      [-0.45, 0.45].forEach(xOff => {
        const eng = new THREE.Mesh(engineGeom, engineMat);
        eng.position.set(xOff, 0.25, -1.8);
        carGroup.add(eng);

        // Exhaust Inner Jet Flame
        const flareGeom = new THREE.ConeGeometry(0.18, 0.9, 16);
        flareGeom.rotateX(-Math.PI / 2);
        const flareMat = new THREE.MeshBasicMaterial({ color: cfg.thrusterColor });
        const flare = new THREE.Mesh(flareGeom, flareMat);
        flare.position.set(xOff, 0.25, -2.3);
        carGroup.add(flare);
        thrusterFlares.push(flare);
      });

      // Rear Point Light for Exhaust Glow
      const rearLight = new THREE.PointLight(cfg.thrusterColor, 2.5, 10);
      rearLight.position.set(0, 0.25, -2.5);
      carGroup.add(rearLight);

      // 5. Forward Projecting Cyber Headlights
      const headSphereGeom = new THREE.SphereGeometry(0.1, 12, 12);
      const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      [-0.5, 0.5].forEach(xOff => {
        const hLight = new THREE.Mesh(headSphereGeom, headMat);
        hLight.position.set(xOff, 0.2, 1.8);
        carGroup.add(hLight);
      });

      const forwardSpot = new THREE.SpotLight(0x00F0FF, 3.5, 30, Math.PI / 7, 0.4);
      forwardSpot.position.set(0, 0.3, 1.9);
      forwardSpot.target.position.set(0, -0.5, 12);
      carGroup.add(forwardSpot);
      carGroup.add(forwardSpot.target);

      worldGroup.add(carGroup);

      return {
        group: carGroup,
        color: cfg.color,
        altitude: cfg.altitude,
        radiusX: cfg.radiusX,
        radiusZ: cfg.radiusZ,
        speed: cfg.speed,
        phase: cfg.phase,
        curveFactor: cfg.curveFactor,
        thrusterFlares: thrusterFlares,
        rearLight: rearLight,
        velocity: new THREE.Vector3(0, 0, 1),
        currentRoll: 0
      };
    }

    // ------------------------------------------------------------------------
    // CYBERPUNK MEGAPOLIS & FLYING CAR WORLD BUILDER
    // ------------------------------------------------------------------------
    function build3DCyberpunkCity(carCount = 5) {
      clearWorld();
      currentTheme = 'cyberpunk_city';
      document.getElementById('hudBadge').textContent = `60 FPS WEBGL • CYBERPUNK METROPOLIS [${carCount} AEROCARS IN TRAFFIC]`;

      scene.fog = new THREE.FogExp2(0x050014, 0.022);
      scene.background = new THREE.Color(0x020008);
      floorGrid.visible = true;

      // 1. Procedural Cyberpunk Skyscrapers (22 towers)
      const buildingColors = [0x00F0FF, 0xFF007F, 0x00FF88, 0xFFE600, 0x7000FF];
      const gridCoords = [

      const p = prompt.toLowerCase();
      if (p.includes('car') || p.includes('flying') || p.includes('cyberpunk') || p.includes('city') || p.includes('vehicle') || p.includes('traffic')) {
        build3DCyberpunkCity(parseInt(document.getElementById('trafficSlider').value) || 5);

        build3DWatch();

        build3DMusicFestival();
      } else {
        build3DCyberpunkCity(4);
      }
    }

    // ------------------------------------------------------------------------
    // MASTER ANIMATION LOOP
    // ------------------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      // 1. Update Flying Cars Aerodynamics & Trajectory
      if (flyingCars.length > 0) {
        const speedFactor = isNitro ? carSpeedMult * 2.4 : carSpeedMult;

        flyingCars.forEach((car, idx) => {
          const t = elapsed * speedFactor * (car.speed * 0.35) + car.phase;
          
          // Lissajous / Elliptical Orbit
          const x = Math.sin(t) * car.radiusX;
          const z = Math.cos(t * car.curveFactor) * car.radiusZ;
          const bob = Math.sin(elapsed * 3.0 + idx) * 0.35;
          const y = car.altitude + bob;

          // Next position to calculate tangent velocity vector & banking roll
          const dt = 0.05;
          const nextX = Math.sin(t + dt) * car.radiusX;
          const nextZ = Math.cos((t + dt) * car.curveFactor) * car.radiusZ;
          const dirX = nextX - x;
          const dirZ = nextZ - z;

          car.group.position.set(x, y, z);
          car.velocity.set(dirX, 0, dirZ);

          // Heading Yaw rotation
          const yaw = Math.atan2(dirX, dirZ);
          car.group.rotation.y = yaw;

          // Realistic Aerodynamic Banking (Roll into turn)
          const curvature = (dirX * Math.cos(t) - dirZ * Math.sin(t));
          const targetRoll = Math.max(-0.45, Math.min(0.45, -dirX * 0.12));
          car.currentRoll += (targetRoll - car.currentRoll) * 0.1;
          car.group.rotation.z = car.currentRoll;

          // Thruster Jet Flare Pulsing & Nitro elongation
          const flameScale = (isNitro ? 2.5 : 1.0) + Math.sin(elapsed * 20.0 + idx) * 0.25;
          car.thrusterFlares.forEach(fl => {
            fl.scale.set(1.0, flameScale, 1.0);
          });
        });

        // 2. Dynamic Camera Modes
        if (cameraMode === 'chase' && flyingCars[0]) {
          const lead = flyingCars[0].group;
          const fwd = flyingCars[0].velocity.clone().normalize();
          const desiredCamPos = lead.position.clone()
            .sub(fwd.clone().multiplyScalar(7.5))
            .add(new THREE.Vector3(0, 2.8, 0));

          camera.position.lerp(desiredCamPos, 0.08);
          camera.lookAt(lead.position.clone().add(fwd.clone().multiplyScalar(12)));
        } else if (cameraMode === 'flythrough') {
          const camT = elapsed * 0.18;
          camera.position.x = Math.sin(camT) * 16;
          camera.position.z = Math.cos(camT) * 16;
          camera.position.y = 8 + Math.sin(camT * 2) * 2;
          camera.lookAt(0, 5, 0);
        } else {
          controls.update();
        }
      } else {
        controls.update();
      }

      // 3. Theme-Specific Animations
      if (currentTheme === 'luxury_watch' && watchHands.length > 0) {
        watchHands.forEach(h => {
          h.mesh.rotation.y = -elapsed * h.speed;
        });
      } else if (currentTheme === 'gaming_portal' && portalCore) {
        portalCore.children[0].rotation.y += 0.015;
        portalCore.children[0].rotation.x += 0.008;
        portalCore.children[1].rotation.y -= 0.01;
        portalCore.children[1].rotation.z += 0.005;
      } else if (currentTheme === 'music_festival' && eqBars.length > 0) {
        eqBars.forEach((bar, i) => {
          const scaleY = 0.5 + Math.abs(Math.sin(elapsed * 4.0 + bar.phase)) * 2.2;
          bar.mesh.scale.y = scaleY;
          bar.mesh.position.y = (bar.baseHeight * scaleY) / 2;
        });
      }

      // Starfield subtle rotation
      if (particlesGroup) {
        particlesGroup.rotation.y += 0.0006;
      }

      renderer.render(scene, camera);
    }

    // ------------------------------------------------------------------------
    // GENERATION PIPELINE & BACKEND API INTERACTION
    // ------------------------------------------------------------------------
    let currentVariants = [];
    let activeIdx = 0;

    async function generate3D() {
      const prompt = document.getElementById('promptInput').value;
      const statusDot = document.getElementById('statusDot');
      const statusLabel = document.getElementById('statusLabel');
      const timeLabel = document.getElementById('timeLabel');

      statusDot.style.background = 'var(--yellow)';
      statusDot.style.boxShadow = '0 0 8px var(--yellow)';
      statusLabel.textContent = 'Synthesizing 3D Aerocar World...';
      const t0 = performance.now();

      // Immediately build the interactive 3D world in the viewport!
      build3DWorldFromPrompt(prompt);

      try {
        const apiUrl = window.location.origin + '/api/3d/generate';
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt }),
        });

        if (!res.ok) throw new Error('Backend HTTP ' + res.status);
        const data = await res.json();
        currentVariants = data.variants || [];
        renderVariants(currentVariants);
        selectVariant(0);

        const elapsed = Math.round(performance.now() - t0);
        statusDot.style.background = 'var(--green)';
        statusDot.style.boxShadow = '0 0 8px var(--green)';
        statusLabel.textContent = 'Aerocar Simulation Live';
        timeLabel.textContent = `${elapsed}ms`;
      } catch (err) {
        console.warn('Using client-side accelerated generator:', err);
        statusDot.style.background = 'var(--green)';
        statusDot.style.boxShadow = '0 0 8px var(--green)';
        statusLabel.textContent = 'Local 3D Engine Active';
        timeLabel.textContent = '<3s Ready';
        loadFallback(prompt);
      }
    }

    function renderVariants(variants) {
      const container = document.getElementById('variantsContainer');
      container.innerHTML = '';
      variants.forEach((v, i) => {
        const card = document.createElement('div');
        card.className = `variant-card ${i === activeIdx ? 'active' : ''}`;
        card.onclick = () => selectVariant(i);
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px; font-weight:700; color:${i === activeIdx ? 'var(--cyan)' : '#e5e7eb'};">
              Variant #${i + 1}
            </span>
            <span style="font-size:9px; background:#1c1730; color:#c4b5fd; padding:2px 6px; border-radius:4px;">
              ${v.style || 'R3F Ready'}
            </span>
          </div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${v.title}
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--text-dim);">
            <span>R3F Ready</span>
            <button style="background:#2c1545; color:var(--magenta); border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-weight:700;" onclick="event.stopPropagation(); remixWithAI();">
              Remix 🪄
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectVariant(idx) {
      activeIdx = idx;
      const v = currentVariants[idx];
      if (!v) return;

      document.querySelectorAll('.variant-card').forEach((c, i) => {
        c.classList.toggle('active', i === idx);
      });

      document.getElementById('codeViewer').textContent = v.r3f_code;

      // Re-trigger world generation for the variant theme if needed
      if (idx === 1 && currentTheme === 'cyberpunk_city') {
        // Variant 2: Minimalist Night Grid
        document.getElementById('hudBadge').textContent = `60 FPS WEBGL • ${v.title.toUpperCase()}`;
        if (dirLight) dirLight.color.setHex(0xFFD700);
      } else if (idx === 2 && currentTheme === 'cyberpunk_city') {
        // Variant 3: Kinetic Hyper-Speed
        document.getElementById('hudBadge').textContent = `60 FPS WEBGL • ${v.title.toUpperCase()}`;
        if (dirLight) dirLight.color.setHex(0xFF007F);
      }
    }

    function applyPreset(name, prompt) {
      document.getElementById('promptInput').value = prompt;
      generate3D();
    }

    function remixWithAI() {
      const prompt = document.getElementById('promptInput').value;
      document.getElementById('promptInput').value = `Remix with AI: ${prompt} with nitro vortex afterburners`;
      generate3D();
    }

    function copyCode() {
      const code = document.getElementById('codeViewer').textContent;
      navigator.clipboard.writeText(code);
      alert('React Three Fiber (R3F) code copied to clipboard!');
    }

    function openExportModal() {
      const code = document.getElementById('codeViewer').textContent;
      const blob = new Blob([code], { type: 'text/typescript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'GeneratedScene.tsx';
      a.click();
    }

    function loadFallback(userPrompt = '') {
      currentVariants = [
        {
          id: 'v1',
          title: 'Cyberpunk Metropolis 2099 (Cinematic)',
          style: 'Cinematic Atmosphere',
          r3f_code: `import React, { useRef } from 'react';
import { Canvas, useFrame } from '@react-three/fiber';
import { OrbitControls, Float, Stars, Box, Cylinder } from '@react-three/drei';
import { EffectComposer, Bloom } from '@react-three/postprocessing';
import * as THREE from 'three';

function FlyingVehicles() {
  const group = useRef<THREE.Group>(null);
  useFrame(({ clock }) => {
    if (group.current) {
      const t = clock.getElapsedTime() * 1.5;
      group.current.position.x = Math.sin(t) * 9;
      group.current.position.z = Math.cos(t * 0.8) * 6;
      group.current.rotation.y = Math.atan2(Math.cos(t) * 9, -Math.sin(t * 0.8) * 4.8);
      group.current.rotation.z = -Math.cos(t) * 0.3; // Banking
    }
