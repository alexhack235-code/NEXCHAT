<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061320">
  <title>Province of Nova Scotia // Trans-Canada Cyberway [NS]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/canada-province-hud.css">
</head>
<body data-province="nova-scotia" style="--prov-accent:#38bdf8;--prov-bg:#061320;--prov-glow:rgba(56,189,248,0.35);">
  <div id="canvas-container" aria-label="Nova Scotia 3D Simulation Canvas"></div>

  <header id="province-hud" class="province-hud" aria-label="Province Telemetry HUD"></header>
  <aside id="mission-tracker" class="mission-tracker" aria-label="Landmark Scanner"></aside>
  <aside id="radar-container" aria-label="Tactical Radar">
    <canvas id="hud-radar-canvas" width="116" height="116"></canvas>
  </aside>
  <section id="cruiser-hud" aria-label="Highway Cruiser Telemetry"></section>
  <div id="interact-prompt" role="status" aria-live="polite"></div>
  <div id="notify-box" role="status" aria-live="polite"></div>
  <div id="mobile-touch-controls" aria-label="Mobile Touch Controls"></div>
  <div id="province-atlas-modal" class="province-modal" role="dialog" aria-modal="true" aria-label="Canada 14-Province Atlas"></div>
  <div id="modal-codex" class="province-modal" role="dialog" aria-modal="true" aria-label="Canadian Codex"></div>

  <script src="/js/three.min.js"></script>
  <script>if (typeof THREE === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
  <script src="/src/game/canada-provinces-data.js"></script>
  <script src="/src/game/canada-landmarks.js"></script>
  <script src="/src/game/canada-province-engine.js"></script>
  <script>window.addEventListener('DOMContentLoaded', () => window.CanadaProvinceEngine?.boot?.('nova-scotia'));</script>
</body>
</html>
