<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgRadial" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Emerald to Cyan Laser Gradient -->
    <linearGradient id="neonEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Cyan to Magenta Prism Gradient -->
    <linearGradient id="prismGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="cardBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Volumetric Neon Filters -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Squircle Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgRadial)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#cardBorderGlow)" stroke-width="3" />

  <!-- Ambient Quantum Ring Backing -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#00ff66" stroke-width="1" opacity="0.15" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.2" />

  <!-- Left Stem of Geometric 'N' -->
  <g filter="url(#hyperGlow)">
    <polygon points="128,370 188,370 216,142 156,142" fill="url(#neonEmeraldCyan)" />
  </g>
  <!-- Left Stem Bevel / Highlight -->
  <polygon points="156,142 176,142 148,370 128,370" fill="url(#glassReflection)" />

  <!-- Right Stem of Geometric 'N' -->
  <g filter="url(#hyperGlow)">
    <polygon points="296,370 356,370 384,142 324,142" fill="url(#prismGradient)" />
  </g>
  <!-- Right Stem Highlight -->
  <polygon points="324,142 344,142 316,370 296,370" fill="url(#glassReflection)" />

  <!-- Dynamic Diagonal Crossing Ribbon -->
  <g filter="url(#hyperGlow)">
    <polygon points="156,142 220,142 356,370 292,370" fill="url(#prismGradient)" opacity="0.95" />
  </g>

  <!-- Central Nexus Core Spark (Optical Chat Pulse) -->
  <g filter="url(#hyperGlow)">
    <circle cx="256" cy="256" r="32" fill="#060913" stroke="#00f2fe" stroke-width="4" />
    <circle cx="256" cy="256" r="20" fill="url(#neonEmeraldCyan)" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>

  <!-- Orbital Data Satellites -->
  <circle cx="198" cy="180" r="5" fill="#00ff66" filter="url(#softGlow)" />
  <circle cx="314" cy="332" r="5" fill="#00f2fe" filter="url(#softGlow)" />
  <circle cx="340" cy="188" r="4" fill="#ec4899" filter="url(#softGlow)" />
  <circle cx="172" cy="324" r="4" fill="#a855f7" filter="url(#softGlow)" />

  <!-- Subtle Top Glass Curvature Highlight -->
  <path d="M 32 124 C 32 65, 65 32, 124 32 L 388 32 C 447 32, 480 65, 480 124 C 360 160, 150 160, 32 124 Z" fill="url(#glassReflection)" opacity="0.4" />
</svg>
