<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Space Optical Glass Backing -->
    <radialGradient id="csGlassBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="45%" stop-color="#060b18" />
      <stop offset="75%" stop-color="#03060d" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Outer Titanium Chasis Gradient -->
    <linearGradient id="csTitaniumBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a384f" />
      <stop offset="25%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#3b4f6e" />
      <stop offset="75%" stop-color="#0e1522" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Anamorphic Multi-Coating Optical Reflection -->
    <linearGradient id="csAnamorphicCoating" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#4facfe" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#6b11ff" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#ff0844" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.9" />
    </linearGradient>

    <!-- Luxury 24K Gold Cinema Accent -->
    <linearGradient id="csGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#ff7e40" />
    </linearGradient>

    <!-- Cyberpunk Neon Green/Cyan Ingress -->
    <linearGradient id="csNeonCyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Shutter Blade Shading -->
    <linearGradient id="csBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e283d" />
      <stop offset="40%" stop-color="#101726" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Center Sensor Pupil Glow -->
    <radialGradient id="csPupilCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#72e7ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="75%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Lens Flare Glow Filter -->
    <filter id="csNeonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="csIntenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Outer Bezel & Metal Housing (Deep 800x800 Canvas) -->
  <circle cx="400" cy="400" r="380" fill="url(#csTitaniumBezel)" stroke="#334155" stroke-width="3" />
  <circle cx="400" cy="400" r="366" fill="url(#csGlassBase)" stroke="#0f172a" stroke-width="4" />

  <!-- 2. Knurled Gear / Focus Teeth Outer Ring (36 Micro-Teeth for Cine Lens Rig) -->
  <g stroke="#475569" stroke-width="2.5" opacity="0.65">
    <!-- Quadrant 1 -->
    <line x1="400" y1="26" x2="400" y2="40" stroke="#00f2ff" stroke-width="4" filter="url(#csNeonBloom)" />
    <line x1="465" y1="32" x2="462" y2="46" />
    <line x1="530" y1="50" x2="524" y2="63" />
    <line x1="590" y1="80" x2="581" y2="92" />
    <line x1="643" y1="122" x2="631" y2="132" />
    <line x1="688" y1="174" x2="674" y2="182" />
    <line x1="722" y1="234" x2="706" y2="240" />
    <line x1="744" y1="300" x2="726" y2="304" />
    <line x1="752" y1="368" x2="733" y2="370" />

    <!-- 90 Degree Marker -->
    <line x1="774" y1="400" x2="760" y2="400" stroke="#ff0844" stroke-width="4" filter="url(#csNeonBloom)" />
    <line x1="752" y1="432" x2="733" y2="430" />
    <line x1="744" y1="500" x2="726" y2="496" />
    <line x1="722" y1="566" x2="706" y2="560" />
    <line x1="688" y1="626" x2="674" y2="618" />
    <line x1="643" y1="678" x2="631" y2="668" />
    <line x1="590" y1="720" x2="581" y2="708" />
    <line x1="530" y1="750" x2="524" y2="737" />
    <line x1="465" y1="768" x2="462" y2="754" />

    <!-- 180 Degree Marker -->
    <line x1="400" y1="774" x2="400" y2="760" stroke="#00ff88" stroke-width="4" filter="url(#csNeonBloom)" />
    <line x1="335" y1="768" x2="338" y2="754" />
    <line x1="270" y1="750" x2="276" y2="737" />
    <line x1="210" y1="720" x2="219" y2="708" />
    <line x1="157" y1="678" x2="169" y2="668" />
    <line x1="112" y1="626" x2="126" y2="618" />
    <line x1="78" y1="566" x2="94" y2="560" />
    <line x1="56" y1="500" x2="74" y2="496" />
    <line x1="48" y1="432" x2="67" y2="430" />

    <!-- 270 Degree Marker -->
    <line x1="26" y1="400" x2="40" y2="400" stroke="#ffd700" stroke-width="4" filter="url(#csNeonBloom)" />
    <line x1="48" y1="368" x2="67" y2="370" />
    <line x1="56" y1="300" x2="74" y2="304" />
    <line x1="78" y1="234" x2="94" y2="240" />
    <line x1="112" y1="174" x2="126" y2="182" />
    <line x1="157" y1="122" x2="169" y2="132" />
    <line x1="210" y1="80" x2="219" y2="92" />
    <line x1="270" y1="50" x2="276" y2="63" />
    <line x1="335" y1="32" x2="338" y2="46" />
  </g>

  <!-- 3. Technical Cinema Markings (Hollywood Optics Calibrations) -->
  <path id="textArcTop" d="M 120 400 A 280 280 0 0 1 680 400" fill="none" stroke="none" />
  <text font-family="'Orbitron', 'Inter', monospace" font-size="16.5" font-weight="800" fill="#94a3b8" letter-spacing="8" opacity="0.85">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      CAMSHOT CINE ANAMORPHIC • T1.2 35MM
    </textPath>
  </text>

  <path id="textArcBottom" d="M 680 400 A 280 280 0 0 1 120 400" fill="none" stroke="none" />
  <text font-family="'Orbitron', 'Inter', monospace" font-size="14.5" font-weight="700" fill="#64748b" letter-spacing="6" opacity="0.75">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      SUPER 35 • 8K RAW • QUANTUM REELS
    </textPath>
  </text>

  <!-- 4. Luminous Multi-Coating Laser Ring -->
  <circle cx="400" cy="400" r="328" fill="none" stroke="url(#csAnamorphicCoating)" stroke-width="4.5" filter="url(#csNeonBloom)" />
  <circle cx="400" cy="400" r="316" fill="none" stroke="url(#csGoldAccent)" stroke-width="2" opacity="0.85" />
  <circle cx="400" cy="400" r="302" fill="#080e1a" stroke="#1e293b" stroke-width="3" />

  <!-- 5. Mathematical 8-Blade Curved Titanium Iris Aperture (Octagonal Dynamic Vortex) -->
  <g id="irisVortex" transform="rotate(22.5, 400, 400)">
    <!-- Blade 1 -->
    <path d="M 400 110 C 510 110, 608 172, 656 264 L 460 360 C 440 330, 410 314, 380 310 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
    <!-- Blade 2 -->
    <path d="M 656 264 C 694 340, 694 440, 656 516 L 440 440 C 452 408, 444 374, 420 350 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
    <!-- Blade 3 -->
    <path d="M 656 516 C 608 608, 510 670, 400 670 L 360 460 C 390 440, 406 410, 410 380 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
    <!-- Blade 4 -->
    <path d="M 400 670 C 290 670, 192 608, 144 516 L 340 440 C 348 472, 376 492, 406 496 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
    <!-- Blade 5 -->
    <path d="M 144 516 C 106 440, 106 340, 144 264 L 360 360 C 348 392, 356 426, 380 450 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
    <!-- Blade 6 -->
    <path d="M 144 264 C 192 172, 290 110, 400 110 L 440 340 C 410 360, 394 390, 390 420 Z"
          fill="url(#csBladeGrad)" stroke="url(#csNeonCyanGreen)" stroke-width="2.5" />
  </g>

  <!-- 6. Aperture Inner Horizon Ring -->
  <circle cx="400" cy="400" r="148" fill="#020409" />
  <circle cx="400" cy="400" r="148" fill="none" stroke="url(#csAnamorphicCoating)" stroke-width="3" filter="url(#csNeonBloom)" />
  <circle cx="400" cy="400" r="136" fill="url(#csGlassBase)" stroke="#1e293b" stroke-width="2" />

  <!-- 7. Central Sapphire Optical Pupil Element -->
  <circle cx="400" cy="400" r="98" fill="url(#csPupilCore)" filter="url(#csIntenseGlow)" />
  <circle cx="400" cy="400" r="98" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- 8. Anamorphic Horizontal Blue Laser Flare (Iconic Cine Signature) -->
  <path d="M 230 400 L 570 400" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" filter="url(#csNeonBloom)" opacity="0.95" />
  <path d="M 290 400 L 510 400" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#csNeonBloom)" />
  <circle cx="400" cy="400" r="14" fill="#ffffff" filter="url(#csIntenseGlow)" />

  <!-- 9. Dynamic Play / Record Iris Triangle Glyph (CamShot DNA) -->
  <polygon points="382,358 438,400 382,442" fill="#ffffff" filter="url(#csNeonBloom)" />
  <polygon points="382,358 438,400 382,442" fill="url(#csGoldAccent)" opacity="0.92" />
  
  <!-- Precision Center Specular Highlight Flare -->
  <ellipse cx="360" cy="360" rx="46" ry="18" transform="rotate(-38, 360, 360)" fill="#ffffff" opacity="0.45" />
  <ellipse cx="440" cy="440" rx="30" ry="12" transform="rotate(-38, 440, 440)" fill="#00f2fe" opacity="0.55" filter="url(#csNeonBloom)" />

  <!-- 10. Pro Crown Accent Calibrations -->
  <circle cx="400" cy="50" r="6" fill="#00f2fe" filter="url(#csNeonBloom)" />
  <circle cx="750" cy="400" r="6" fill="#ff0844" filter="url(#csNeonBloom)" />
  <circle cx="400" cy="750" r="6" fill="#00ff88" filter="url(#csNeonBloom)" />
  <circle cx="50" cy="400" r="6" fill="#ffd700" filter="url(#csNeonBloom)" />
</svg>
