<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      #unity-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 320px; text-align: center; color: #00f2ff; font-weight: 700;
      }
      #unity-progress-bar-empty {
        width: 100%; height: 10px; background: rgba(255, 255, 255, 0.12);
        border-radius: 6px; margin-top: 14px; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.4);
      }
      #unity-progress-bar-full {
        width: 0%; height: 100%; background: linear-gradient(90deg, #00f2ff, #00ff88);
        border-radius: 6px; transition: width 0.15s ease-out; box-shadow: 0 0 12px #00f2ff;
      }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); background: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div style="font-size: 18px; letter-spacing: 2px;">ASTROSHIFT · UNITY WEBGL</div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">INITIALIZING WEBASSEMBLY ENGINE</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = type === 'error' ? 'block' : 'none';
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
        devicePixelRatio: (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 800) ? 1.0 : Math.min(window.devicePixelRatio || 1, 1.25)
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
