<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <radialGradient id="gameShieldBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="60%" stop-color="#050b16" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Neon Cyber Emerald / Cyan Laser Gradient -->
    <linearGradient id="gameNeonLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="35%" stop-color="#00ff88" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Violet / Cyberpunk Glow Gradient -->
    <linearGradient id="cyberVioletGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Metallic Controller Body Gradient -->
    <linearGradient id="controllerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="goldExpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="gameNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseCoreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cybernetic Hexagonal Shield Emblem Background -->
  <polygon points="256,18 474,94 474,342 256,494 38,342 38,94"
           fill="url(#gameShieldBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Neon Polygonal Laser Trace (Inner Border) -->
  <polygon points="256,36 454,106 454,330 256,470 58,330 58,106"
           fill="none" stroke="url(#gameNeonLaser)" stroke-width="3.5" filter="url(#gameNeonGlow)" />

  <!-- Circuit Trace Lines from corners -->
  <g stroke="#00f2ff" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 58 106 L 130 156 L 170 156" />
    <path d="M 454 106 L 382 156 L 342 156" />
    <path d="M 58 330 L 140 330 L 180 370" />
    <path d="M 454 330 L 372 330 L 332 370" />
    <circle cx="170" cy="156" r="3" fill="#00f2ff" />
    <circle cx="342" cy="156" r="3" fill="#00f2ff" />
    <circle cx="180" cy="370" r="3" fill="#00ff88" />
    <circle cx="332" cy="370" r="3" fill="#00ff88" />
  </g>

  <!-- Orbital Cyber Rings -->
  <ellipse cx="256" cy="260" rx="195" ry="85" fill="none" stroke="url(#cyberVioletGrad)" stroke-width="2" opacity="0.65" transform="rotate(-15, 256, 260)" stroke-dasharray="8 6" />

  <!-- Controller Body Shape (Modern Angular Cyber Gamepad) -->
  <!-- Left Grip, Bridge, Right Grip -->
  <path d="M 124 378
           C 100 354, 82 284, 94 220
           C 104 168, 148 148, 198 152
           L 220 178
           L 292 178
           L 314 152
           C 364 148, 408 168, 418 220
           C 430 284, 412 354, 388 378
           C 368 398, 344 380, 328 320
           L 312 264
           L 200 264
           L 184 320
           C 168 380, 144 398, 124 378 Z"
        fill="url(#controllerBodyGrad)" stroke="#334155" stroke-width="3" />

  <!-- Controller Top Edge Neon Accent Arc -->
  <path d="M 120 200 C 145 162, 190 156, 222 176 L 290 176 C 322 156, 367 162, 392 200"
        fill="none" stroke="url(#gameNeonLaser)" stroke-width="3.5" filter="url(#gameNeonGlow)" />

  <!-- Left Side: Futuristic Neon D-PAD -->
  <g id="dpad" transform="translate(152, 216)">
    <!-- D-Pad Base Cross -->
    <path d="M 18 0 L 32 0 L 32 18 L 50 18 L 50 32 L 32 32 L 32 50 L 18 50 L 18 32 L 0 32 L 0 18 L 18 18 Z"
          fill="#0a0f1d" stroke="#00f2ff" stroke-width="2" filter="url(#gameNeonGlow)" />
    <!-- Up, Down, Left, Right Arrows -->
    <polygon points="25,4 21,11 29,11" fill="#00f2ff" />
    <polygon points="25,46 21,39 29,39" fill="#00f2ff" />
    <polygon points="4,25 11,21 11,29" fill="#00f2ff" />
    <polygon points="46,25 39,21 39,29" fill="#00f2ff" />
    <!-- Center Dot -->
    <circle cx="25" cy="25" r="3.5" fill="#00ff88" />
  </g>

  <!-- Right Side: 4 Diamond Action Crystals (X, Y, A, B) -->
  <g id="actionButtons" transform="translate(310, 216)">
    <!-- Button Top (Y - Gold) -->
    <circle cx="25" cy="6" r="9" fill="#0a0f1d" stroke="#fbbf24" stroke-width="2" filter="url(#gameNeonGlow)" />
    <text x="25" y="10" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="9" fill="#fbbf24">Y</text>

    <!-- Button Left (X - Cyan) -->
    <circle cx="6" cy="25" r="9" fill="#0a0f1d" stroke="#00f2ff" stroke-width="2" filter="url(#gameNeonGlow)" />
    <text x="6" y="29" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="9" fill="#00f2ff">X</text>

    <!-- Button Right (B - Magenta) -->
    <circle cx="44" cy="25" r="9" fill="#0a0f1d" stroke="#ec4899" stroke-width="2" filter="url(#gameNeonGlow)" />
    <text x="44" y="29" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="9" fill="#ec4899">B</text>

    <!-- Button Bottom (A - Emerald) -->
    <circle cx="25" cy="44" r="9" fill="#0a0f1d" stroke="#00ff88" stroke-width="2" filter="url(#gameNeonGlow)" />
    <text x="25" y="48" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="9" fill="#00ff88">A</text>
  </g>

  <!-- Twin Glowing Analog Thumbsticks -->
  <!-- Left Analog Stick (Lower Center) -->
  <circle cx="210" cy="305" r="22" fill="#0b111e" stroke="#334155" stroke-width="2" />
  <circle cx="210" cy="305" r="16" fill="url(#gameShieldBg)" stroke="url(#gameNeonLaser)" stroke-width="2" filter="url(#gameNeonGlow)" />
  <circle cx="210" cy="305" r="6" fill="#00ff88" />

  <!-- Right Analog Stick (Lower Center) -->
  <circle cx="302" cy="305" r="22" fill="#0b111e" stroke="#334155" stroke-width="2" />
  <circle cx="302" cy="305" r="16" fill="url(#gameShieldBg)" stroke="url(#cyberVioletGrad)" stroke-width="2" filter="url(#gameNeonGlow)" />
  <circle cx="302" cy="305" r="6" fill="#8b5cf6" />

  <!-- Central NEX Core Sphere (The Quantum Gateway) -->
  <circle cx="256" cy="216" r="18" fill="#020617" stroke="url(#gameNeonLaser)" stroke-width="2.5" filter="url(#gameNeonGlow)" />
  <polygon points="256,204 266,222 246,222" fill="#00ff88" filter="url(#intenseCoreGlow)" />
  <polygon points="256,228 266,210 246,210" fill="#00f2ff" opacity="0.8" />

  <!-- Shoulder Bumpers L1/R1 -->
  <path d="M 148 140 C 172 134, 198 136, 214 148" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <path d="M 364 140 C 340 134, 314 136, 298 148" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />

  <!-- Glowing Emblem Banner at bottom of shield -->
  <g transform="translate(256, 436)">
    <!-- Small Crest Badge -->
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#030712" stroke="url(#gameNeonLaser)" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="'Orbitron', monospace" font-size="11" font-weight="900" fill="#00f2ff" letter-spacing="2">GAMING</text>
  </g>

  <!-- Crown Star at Shield Top Vertex -->
  <polygon points="256,50 260,60 270,62 262,68 264,78 256,72 248,78 250,68 242,62 252,60" fill="url(#goldExpGrad)" filter="url(#gameNeonGlow)" />
</svg>
