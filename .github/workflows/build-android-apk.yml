name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Dist Folder
        run: python scripts/prepare_dist.py

      - name: Sync Capacitor Android
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > ../gradle_build.log 2>&1 || exit 1

      - name: Publish Gradle Error Diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp gradle_build.log gradle_build.txt
          git add -f gradle_build.txt
          git commit -m "ci: capture gradle build log"
          git push -f origin debug-log

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/NEXCHAT-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXCHAT-debug-apk
          path: dist-apk/NEXCHAT-debug.apk
          if-no-files-found: error
          retention-days: 30
