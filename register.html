<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00ff66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>NEXCHAT — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="login.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
</head>
<body>

<div class="login-container" style="max-width: 480px;">
  <a href="landing.html" title="NEXCHAT Home">
    <img src="logo.jpg" class="logo" alt="NEXCHAT Logo">
  </a>
  <h2>CREATE ACCOUNT</h2>
  <p class="subtitle">Join NEXCHAT for secure, end-to-end encrypted messaging, calls, and gaming.</p>

  <form id="registerForm" autocomplete="on">
    <input type="text" id="regName" placeholder="Full Name" autocomplete="name" required minlength="2">
    <input type="text" id="regUsername" placeholder="Username (letters, numbers, _)" autocomplete="username" required minlength="3" maxlength="20">
    <input type="email" id="regEmail" placeholder="Email address" autocomplete="email" required>
    
    <div class="password-field">
      <input type="password" id="regPassword" placeholder="Create strong password" autocomplete="new-password" required minlength="8">
      <button type="button" class="password-toggle" data-target="regPassword" aria-label="Show password">Show</button>
    </div>

    <div class="password-field">
      <input type="password" id="regPasswordConfirm" placeholder="Confirm password" autocomplete="new-password" required minlength="8">
      <button type="button" class="password-toggle" data-target="regPasswordConfirm" aria-label="Show password">Show</button>
    </div>

    <button type="submit" class="auth-btn">
      <i class="fa-solid fa-user-plus"></i>
      <span>Create Free Account</span>
    </button>
  </form>

  <div class="divider">
    <span>OR</span>
  </div>

  <div class="google-signin-block">
    <div id="googleSignInContainer" class="google-signin-container"></div>
    <p class="google-hint">Sign up instantly with your Google account</p>
  </div>

  <div class="page-action-group" style="grid-template-columns: 1fr;">
    <button type="button" class="page-action-btn secondary" onclick="location.href='index.html'">
      <i class="fa-solid fa-arrow-left"></i> Already have an account? <strong>Log In</strong>
    </button>
  </div>

  <div id="result" class="result-box" role="status" aria-live="polite"></div>
</div>

<footer class="app-footer">
  <p>CREATED BY <span class="dev-name">NEXO-TECH</span> | POWERED BY <span class="dev-team">NEXCHAT_DEV TEAMS</span></p>
</footer>

<script type="module" src="app-prompt.js"></script>
<script type="module" src="pwa-install.js"></script>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
