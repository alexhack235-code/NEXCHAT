<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <!-- Neon Emerald to Cyan to Violet Gradients -->
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A82F6" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.9" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Card Back -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Futuristic Orbit Lines (CamShot optics) -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="220" r="130" fill="none" stroke="rgba(0, 255, 102, 0.12)" stroke-width="1.5" />

  <!-- Left Stem of Geometric 'N' -->
  <polygon points="120,310 180,310 220,130 160,130" fill="url(#emeraldCyan)" filter="url(#neonGlow)" />
  <polygon points="120,310 160,130 140,170 120,280" fill="#00FF66" opacity="0.6" />

  <!-- Right Stem of Geometric 'N' -->
  <polygon points="292,310 352,310 392,130 332,130" fill="url(#cyanPurple)" filter="url(#neonGlow)" />
  <polygon points="352,310 392,130 372,210 340,310" fill="#A855F7" opacity="0.7" />

  <!-- Diagonal Connecting Fold -->
  <polygon points="175,130 230,130 335,310 280,310" fill="url(#cyanPurple)" opacity="0.85" />

  <!-- Center CAMSHOT Camera Aperture Lens (Optical Iris) -->
  <circle cx="256" cy="220" r="62" fill="#060913" stroke="url(#lensRing)" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="256" cy="220" r="48" fill="#0c1222" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="256" cy="220" r="32" fill="#030712" stroke="#00D2FF" stroke-width="2" />
  <circle cx="256" cy="220" r="18" fill="url(#emeraldCyan)" />
  <circle cx="248" cy="212" r="6" fill="#FFFFFF" opacity="0.8" />

  <!-- Modern Typography: NEXCHAT -->
  <text x="256" y="380" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NEXCHAT</text>

  <!-- Sub-Badge Typography: CAMSHOT -->
  <g transform="translate(256, 420)">
    <rect x="-80" y="-18" width="160" height="26" rx="13" fill="rgba(0, 210, 255, 0.12)" stroke="url(#emeraldCyan)" stroke-width="1.5" />
    <text x="0" y="0" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#00D2FF" text-anchor="middle" letter-spacing="3" dominant-baseline="central">CAMSHOT</text>
  </g>
</svg>