<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXIUM OMNI // Quantum AI Workstation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/nexium-omni.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="brand-pill" onclick="newChat(); return false;">
                <div class="brand-logo-hex">
                    <svg class="icon icon-sm" viewBox="0 0 24 24">
                        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
                        <line x1="12" y1="22" x2="12" y2="15.5"></line>
                        <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
                        <polyline points="2 15.5 12 8.5 22 15.5"></polyline>
                        <line x1="12" y1="2" x2="12" y2="8.5"></line>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-title">NEXIUM</span>
                    <span class="brand-tag">OMNI // 3.0</span>
                </div>
            </a>
            <button class="sidebar-action-btn" title="Collapse Sidebar (Ctrl+B)" onclick="toggleSidebar()">
                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><path d="m14 9-3 3 3 3"></path></svg>
            </button>
        </div>

        <div class="new-chat-dock">
            <button class="btn-new-session" onclick="newChat()">
                <span style="display:flex; align-items:center; gap:8px;">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Session
                </span>
                <span class="shortcut">Ctrl+N</span>
            </button>
        </div>

        <div class="search-dock">
            <div class="search-box">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="chatSearchInput" placeholder="Filter conversations..." oninput="filterConversations(this.value)">
            </div>
        </div>

        <div class="history-list" id="historyList"></div>

        <div class="sidebar-footer">
            <div class="system-pill" id="systemStatusPill">
                <span class="status-pulse" id="statusPulseDot"></span>
                <span id="backendStatusLabel">STANDBY</span>
            </div>
            <button class="sidebar-action-btn" title="Settings" onclick="openSettingsModal()">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>
    </aside>

    <main class="main-container">
        <header class="top-navbar">
            <div class="nav-left">
                <button class="nav-btn" id="toggleSidebarBtn" title="Toggle Sidebar (Ctrl+B)" onclick="toggleSidebar()">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>

                <div class="model-selector-chip" onclick="openModelPicker()">
                    <div class="model-icon-badge" style="background:rgba(0,240,255,0.15); border-color:#00F0FF;">
                        <svg class="icon icon-sm" style="color:#00F0FF;" viewBox="0 0 24 24"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon><line x1="12" y1="22" x2="12" y2="15.5"></line></svg>
                    </div>
                    <div class="model-info-stack">
                        <span class="model-name" id="currentModelName">Gemini 3.8 Flash</span>
                        <span class="model-sub" id="currentEngineTag">&lt;300MS POOL</span>
                    </div>
                    <svg class="icon icon-sm" style="color:var(--text-dim);" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>

            <div class="nav-right">
                <button class="nav-btn" id="thinkToggleBtn" title="Deep Think / Reasoning Mode" onclick="toggleThinkMode()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"></path><line x1="10" y1="22" x2="14" y2="22"></line></svg>
                    <span>Deep Think</span>
                </button>

                <button class="nav-btn" id="webToggleBtn" title="Web Search & Realtime Intel" onclick="toggleWebMode()">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>Web Intel</span>
                </button>

                <button class="nav-btn" id="canvasToggleBtn" title="Quantum Code Canvas Sandbox (Ctrl+J)" onclick="toggleCanvas()">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                    <span>Canvas</span>
                </button>

                <button class="nav-btn" id="soundToggleBtn" title="Sound Synthesizer" onclick="toggleSound()">
                    <svg class="icon" id="soundIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
            </div>
        </header>

        <div class="workspace-body">
            <div class="chat-viewport" id="chatViewport">
                <div class="chat-scroll-container" id="chatContainer"></div>
            </div>

            <aside class="canvas-drawer hidden" id="canvasDrawer">
                <div class="canvas-header">
                    <div class="canvas-tabs-group">
                        <button class="canvas-tab active" id="tabSandbox" onclick="switchCanvasTab('sandbox')">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Live Sandbox
                        </button>
                        <button class="canvas-tab" id="tabTerminal" onclick="switchCanvasTab('terminal')">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                            Terminal Console
                        </button>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="sidebar-action-btn" title="Reload Canvas" onclick="reloadSandbox()">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                        </button>
                        <button class="sidebar-action-btn" title="Close Canvas" onclick="toggleCanvas(false)">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>

                <div class="canvas-viewport-body">
                    <iframe class="canvas-frame-sandbox" id="sandboxFrame" sandbox="allow-scripts allow-modals"></iframe>
                    <div class="terminal-panel" id="terminalPanel">
                        <div class="terminal-log-line info">NEXIUM TERMINAL RUNTIME INITIALIZED</div>
                        <div class="terminal-log-line info">Ready to accept task execution payloads...</div>
                    </div>
                </div>
            </aside>
        </div>

        <div class="prompt-dock-container">
            <div class="prompt-dock-card">
                <textarea 
                    class="input-textarea" 
                    id="promptTextarea" 
                    rows="1" 
                    placeholder="Ask NEXIUM anything, run Python code, architect systems..."
                    onkeydown="handleTextareaKey(event)"
                    oninput="autoExpandTextarea(this)"
                ></textarea>

                <div class="prompt-toolbar">
                    <div class="prompt-toolbar-left">
                        <button class="tool-chip-btn" id="quickThinkPill" onclick="toggleThinkMode()">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"></path></svg>
                            Think
                        </button>
                        <button class="tool-chip-btn" id="quickWebPill" onclick="toggleWebMode()">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line></svg>
                            Search
                        </button>

                        <button class="tool-chip-btn" id="voiceDictationBtn" title="Voice Dictation" onclick="toggleVoiceDictation()">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                            <div class="voice-wave-anim" id="voiceWaveBars">
                                <div class="voice-bar"></div>
                                <div class="voice-bar"></div>
                                <div class="voice-bar"></div>
                                <div class="voice-bar"></div>
                            </div>
                            <span id="voiceStatusText">Voice</span>
                        </button>
                    </div>

                    <div class="prompt-toolbar-right">
                        <button class="send-btn-nexus" id="submitBtn" onclick="handleSendAction()" title="Send Message (Enter)">
                            <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-backdrop" id="settingsModal" onclick="if(event.target === this) closeSettingsModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    NEXIUM System Configuration
                </h3>
                <button class="sidebar-action-btn" onclick="closeSettingsModal()">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="setting-field-group">
                    <label class="setting-field-label">API Base Endpoint</label>
                    <input type="text" id="settingApiBase" class="setting-input" value="http://localhost:8000">
                </div>

                <div class="setting-field-group">
                    <label class="setting-field-label">Ollama Host URL</label>
                    <input type="text" id="settingOllamaUrl" class="setting-input" value="http://localhost:11434">
                </div>

                <div class="setting-field-group">
                    <label class="setting-field-label">Custom Cloud API Key (Optional)</label>
                    <input type="password" id="settingApiKey" class="setting-input" placeholder="sk-...">
                </div>

                <div class="setting-field-group">
                    <label class="setting-field-label">
                        <span>Temperature</span>
                        <span id="tempValueLabel">0.7</span>
                    </label>
                    <input type="range" id="settingTemperature" min="0" max="1" step="0.05" value="0.7" oninput="document.getElementById('tempValueLabel').textContent = this.value">
                </div>

                <div class="setting-field-group">
                    <label class="setting-field-label">Autonomous System Directives</label>
                    <textarea id="settingSystemPrompt" class="setting-input setting-textarea">You are NEXIUM, an advanced AI system created by NEXO-TECH. You operate with absolute precision, high-speed logical deduction, and clean code generation. Never use emojis. Provide clean, well-structured technical solutions with modern practices.</textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="nav-btn" onclick="checkBackendHealth()">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Test Connectivity
                </button>
                <button class="btn-new-session" style="width:auto; padding:8px 18px;" onclick="saveSettings()">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            currentSessionId: null,
            sessions: [],
            isGenerating: false,
            abortController: null,
            thinkMode: false,
            webMode: false,
            soundEnabled: true,
            selectedModel: "gemini-3.8-flash",
            selectedEngine: "Cloud Key Pool",
            backendStatus: "checking",
            activeCanvasTab: "sandbox",
            audioCtx: null,
            speechRecognition: null,
            isRecordingVoice: false
        };

        const STORAGE_KEY_SESSIONS = "nexium_sessions_v3";
        const STORAGE_KEY_SETTINGS = "nexium_settings_v3";

        const MODEL_REGISTRY = [
            { id: "gemini-3.8-flash", name: "Gemini 3.8 Flash", engine: "Cloud Key Pool", tag: "<300MS ACCEL" },
            { id: "gemini-3.1-pro-preview", name: "Gemini 3.1 Pro", engine: "Cloud Key Pool", tag: "REASONING" },
            { id: "qwen2.5:3b-instruct", name: "Qwen 2.5 3B", engine: "Local Ollama", tag: "LOCAL FAST" },
            { id: "deepseek-r1:latest", name: "DeepSeek R1", engine: "Reasoning Core", tag: "REASONING" },
            { id: "llama3.3:latest", name: "Llama 3.3 70B", engine: "Local Ollama", tag: "HIGH PERFORMANCE" },
            { id: "nexium-rust-engine", name: "NEXIUM Core", engine: "Rust Engine", tag: "NATIVE HYBRID" },
            { id: "cloud-gpt4o", name: "GPT-4o Omni", engine: "Cloud API", tag: "CLOUD PROXY" }
        ];

        function playHoloSound(toneType) {
            if (!state.soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!state.audioCtx) state.audioCtx = new AudioContext();
                const ctx = state.audioCtx;
                if (ctx.state === 'suspended') ctx.resume();

                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                if (toneType === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.04);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (toneType === 'send') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (toneType === 'receive') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.16);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            } catch (err) {}
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSettings();
            loadSessions();
            checkBackendHealth();
            initSpeechRecognition();

            window.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "b") {
                    e.preventDefault();
                    toggleSidebar();
                } else if ((e.ctrlKey || e.metaKey) && e.key === "j") {
                    e.preventDefault();
                    toggleCanvas();
                } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "N") {
                    e.preventDefault();
                    newChat();
                } else if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                    e.preventDefault();
                    document.getElementById("chatSearchInput").focus();
                }
            });
        });

        function loadSessions() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY_SESSIONS);
                state.sessions = stored ? JSON.parse(stored) : [];
            } catch (e) {
                state.sessions = [];
            }

            if (state.sessions.length === 0) {
                newChat(false);
            } else {
                switchSession(state.sessions[0].id);
            }
            renderHistoryList();
        }

        function saveSessions() {
            try {
                localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(state.sessions));
            } catch (e) {}
            renderHistoryList();
        }

        function newChat(triggerSound = true) {
            if (triggerSound) playHoloSound('click');
            const newSession = {
                id: "sess_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7),
                title: "New Session",
                pinned: false,
                timestamp: Date.now(),
                messages: []
            };

            state.sessions.unshift(newSession);
            state.currentSessionId = newSession.id;
            saveSessions();
            renderChat();
            
            const textarea = document.getElementById("promptTextarea");
            if (textarea) {
                textarea.value = "";
                textarea.focus();
            }
        }

        function switchSession(sessionId) {
            playHoloSound('click');
            state.currentSessionId = sessionId;
            renderHistoryList();
            renderChat();
        }

        function deleteSession(sessionId, event) {
            if (event) event.stopPropagation();
            playHoloSound('click');
            state.sessions = state.sessions.filter(s => s.id !== sessionId);
            if (state.currentSessionId === sessionId) {
                if (state.sessions.length > 0) {
                    state.currentSessionId = state.sessions[0].id;
                } else {
                    newChat(false);
                    return;
                }
            }
            saveSessions();
            renderChat();
        }

        function togglePinSession(sessionId, event) {
            if (event) event.stopPropagation();
            playHoloSound('click');
            const session = state.sessions.find(s => s.id === sessionId);
            if (session) {
                session.pinned = !session.pinned;
                saveSessions();
            }
        }

        function renameSession(sessionId, event) {
            if (event) event.stopPropagation();
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;
            const newTitle = prompt("Enter conversation title:", session.title);
            if (newTitle && newTitle.trim()) {
                session.title = newTitle.trim();
                saveSessions();
            }
        }

        function exportSession(sessionId, event) {
            if (event) event.stopPropagation();
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;
            
            let markdown = `# ${session.title}\n\n`;
            session.messages.forEach(msg => {
                const sender = msg.role === 'user' ? 'USER' : 'NEXIUM AI';
                markdown += `### ${sender}\n\n${msg.content}\n\n---\n\n`;
            });

            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${session.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderHistoryList(query = "") {
            const listEl = document.getElementById("historyList");
            if (!listEl) return;
            listEl.innerHTML = "";

            let filtered = state.sessions;
            if (query) {
                const q = query.toLowerCase();
                filtered = state.sessions.filter(s => s.title.toLowerCase().includes(q));
            }

            const pinned = filtered.filter(s => s.pinned);
            const recent = filtered.filter(s => !s.pinned);

            if (pinned.length > 0) {
                const title = document.createElement("div");
                title.className = "history-section-title";
                title.textContent = "Pinned";
                listEl.appendChild(title);

                pinned.forEach(session => listEl.appendChild(createHistoryItemEl(session)));
            }

            if (recent.length > 0) {
                const title = document.createElement("div");
                title.className = "history-section-title";
                title.textContent = "Conversations";
                listEl.appendChild(title);

                recent.forEach(session => listEl.appendChild(createHistoryItemEl(session)));
            }
        }

        function createHistoryItemEl(session) {
            const item = document.createElement("div");
            item.className = `history-item ${session.id === state.currentSessionId ? "active" : ""}`;
            item.onclick = () => switchSession(session.id);

        function parseMarkdown(text) {
            if (!text) return "";
            
            const codeBlocks = [];
            let processed = text.replace(/```([a-zA-Z0-9_\-\.\+]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
                const language = (lang || 'code').trim();
                const cleanCode = code.replace(/\n$/, '');

                const isExecutableWeb = ['html', 'javascript', 'js', 'jsx', 'svg', 'vue', 'web'].includes(language.toLowerCase());
                const isExecutableTerminal = ['python', 'py', 'powershell', 'ps1', 'batch', 'bat', 'rust', 'rs', 'cpp', 'c', 'csharp', 'cs', 'bash', 'sh', 'javascript', 'js', 'node'].includes(language.toLowerCase());

                const blockHtml = `
                    <div class="code-block-wrapper">
                        <div class="code-block-header">
                            <span class="code-lang-tag">${escapeHtml(language)}</span>
                            <div class="code-actions-group">
                                ${isExecutableWeb ? `
                                    <button class="code-btn run-btn" onclick="executeInCanvasSandbox(\`${escapeAttr(cleanCode)}\`, '${escapeAttr(language)}')">
                                        <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                        Run in Canvas
                                    </button>
                                ` : ''}
                                ${isExecutableTerminal ? `
                                    <button class="code-btn run-btn" onclick="executeInTerminal(\`${escapeAttr(cleanCode)}\`, '${escapeAttr(language)}')">
                                        <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                                        Run in Terminal
                                    </button>
                                ` : ''}
                                <button class="code-btn" onclick="copyCodeSnippet(this, \`${escapeAttr(cleanCode)}\`)">
                                    <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    Copy
                                </button>
                            </div>
                        </div>
                        <pre class="code-block-content"><code>${escapeHtml(cleanCode)}</code></pre>
                    </div>
                `;
                codeBlocks.push(blockHtml);
                return placeholder;
            });

            processed = escapeHtml(processed);
            processed = processed.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            processed = processed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08); padding:2px 5px; border-radius:4px; font-family:var(--font-mono); font-size:12px; color:var(--accent-cyan);">$1</code>');

            processed = processed.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            processed = processed.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            processed = processed.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            processed = processed.replace(/^\s*[-*]\s+(.*)$/gim, '<li>$1</li>');
            processed = processed.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            processed = processed.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            processed = processed.replace(/\n\n/g, '<br><br>');

            codeBlocks.forEach((block, idx) => {
                processed = processed.replace(`__CODE_BLOCK_${idx}__`, block);
            });

            return processed;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttr(str) {
            return String(str)
                .replace(/\\/g, "\\\\")
                .replace(/`/g, "\\`")
                .replace(/\$/g, "\\$");
        }

        async function dispatchAiInference(prompt, session) {
            setGeneratingState(true);
            const startTime = Date.now();
            state.abortController = new AbortController();

            const container = document.getElementById("chatContainer");
            const loadingRow = document.createElement("div");
            loadingRow.className = "message-row ai";
            loadingRow.id = "activeLoadingRow";
            loadingRow.innerHTML = `
                <div class="message-avatar-wrap ai">

                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(loadingRow);
            scrollChatToBottom();

            const settings = getSettings();
            let aiText = "";
            let reasoningText = null;
            let citations = [];

            try {
                if (state.webMode) {
                    citations = [
                        { domain: "nexium.network", title: "NEXIUM High-Performance Knowledge Index" },
                        { domain: "docs.python.org", title: "Python Standard Documentation" },
                        { domain: "developer.mozilla.org", title: "Web APIs & Standards Reference" }
                    ];
                }

                if (state.thinkMode) {
                    reasoningText = `Analyzing cognitive requirements for task execution...\nDecomposing problem statement into mathematical invariants.\nFormulating architectural solution with optimal time/space complexity.\nValidating edge cases and ensuring strict Zero-Emoji compliance.\nSynthesizing finalized output response.`;
                }

                let responseSuccess = false;

                const isGemini = state.selectedModel.includes("gemini");
                const candidateUrls = isGemini ? [
                    `${settings.apiBase}/api/gemini/generate`,
                    `http://localhost:8001/api/gemini/generate`,
                    `${settings.apiBase}/api/remote_qwen`,
                    `http://localhost:8001/api/remote_qwen`
                ] : [
                    `${settings.apiBase}/api/remote_qwen`,
                    `http://localhost:8001/api/remote_qwen`,
                    `${settings.apiBase}/api/gemini/generate`,
                    `http://localhost:8001/api/gemini/generate`
                ];

                for (const url of candidateUrls) {
                    try {
                        const res = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                prompt: prompt,
                                max_tokens: 2048,
                                model: state.selectedModel,
                                temperature: parseFloat(settings.temperature)
                            }),
                            signal: state.abortController.signal
                        });

                        if (res.ok) {
                            const data = await res.json();
                            aiText = data.text || data.response || JSON.stringify(data);
                            responseSuccess = true;
                            state.backendStatus = "online";
                            updateStatusPill();
                            break;
                        }
                    } catch (e) {}
                }

                // Fallback: Direct Ollama call if FastAPI is offline
                if (!responseSuccess && settings.ollamaUrl) {
                    try {
                        const res = await fetch(`${settings.ollamaUrl}/api/generate`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: state.selectedModel || "qwen2.5:3b-instruct",
                                prompt: `You are NEXIUM AI created by NEXO-TECH.\n\nUser: ${prompt}\n\nAI: `,
                                stream: false
                            }),
                            signal: state.abortController.signal
                        });
                        if (res.ok) {
                            const data = await res.json();
                            aiText = data.response || "";
                            responseSuccess = true;
                            state.backendStatus = "online";
                            updateStatusPill();
                        }
                    } catch (e) {}
                }

                if (!responseSuccess) {
                    aiText = await generateAutonomousSimulation(prompt, state.selectedModel, state.thinkMode);
                    state.backendStatus = "offline";
                    updateStatusPill();
                }

                const activeRow = document.getElementById("activeLoadingRow");
                if (activeRow) activeRow.remove();

                // Parse and execute ACTION commands from AI response
                const actions = parseAiActions(aiText);
                let executionResults = "";
                if (actions.length > 0) {
                    for (const action of actions) {
                        const result = await executeAiAction(action);
                        executionResults += `\n\n> ⚡ **${result}**`;
                    }
                    aiText += executionResults;
                }

                const duration = ((Date.now() - startTime) / 1000).toFixed(1);

                session.messages.push({
                    role: "assistant",
                    content: aiText,
                    timestamp: Date.now(),
                    reasoning: reasoningText,
                    reasoningDuration: state.thinkMode ? `Computed in ${duration}s` : null,
                    citations: citations,
                    metrics: {
                        tokens: Math.round(aiText.length / 4),
                        duration: duration
                    }
                });

                saveSessions();
                renderChat();
                playHoloSound('receive');

            } catch (err) {
                const activeRow = document.getElementById("activeLoadingRow");
                if (activeRow) activeRow.remove();

                if (err.name === "AbortError") {
                    console.log("Inference aborted by operator.");
                } else {
                    session.messages.push({
                        role: "assistant",
                        content: `System operational notice: Unable to contact local Ollama at ${settings.apiBase}. Ensure Ollama is running via 'ollama serve' or configure connectivity in Settings.`,
                        timestamp: Date.now()
                    });
                    saveSessions();
                    renderChat();
                }
            } finally {
                setGeneratingState(false);
            }
        }

                `${settings.apiBase}/api/execute_task`,
                "http://localhost:8000/api/execute_task",
                "http://localhost:8001/api/execute_task"
            ];

            let executed = false;
            for (const apiUrl of candidateUrls) {
                try {
                    const res = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            type: "code",
                            action: "run",
                            language: langTag,
                            content: code

        function parseAiActions(aiText) {
            // Robust extractor for ACTION: {...} JSON blocks that properly handles nested braces and code
            const actions = [];
            if (!aiText) return actions;

            const marker = "ACTION:";
            let searchIndex = 0;

            while ((searchIndex = aiText.indexOf(marker, searchIndex)) !== -1) {
                const jsonStart = aiText.indexOf("{", searchIndex + marker.length);
                if (jsonStart === -1) break;

                let depth = 0;
                let inString = false;
                let escapeNext = false;
                let jsonEnd = -1;

                for (let i = jsonStart; i < aiText.length; i++) {
                    const char = aiText[i];
                    if (escapeNext) {
                        escapeNext = false;
                        continue;
                    }
                    if (char === "\\") {
                        escapeNext = true;
                        continue;
                    }
                    if (char === '"' && !escapeNext) {
                        inString = !inString;
                        continue;
                    }
                    if (!inString) {
                        if (char === "{") depth++;
                        else if (char === "}") {
                            depth--;
                            if (depth === 0) {
                                jsonEnd = i + 1;
                                break;
                            }
                        }
                    }
                }

                if (jsonEnd !== -1) {
                    const jsonStr = aiText.substring(jsonStart, jsonEnd);
                    try {
                        const action = JSON.parse(jsonStr);
                        actions.push(action);
                    } catch (e) {
                        console.error("Failed to parse action JSON:", jsonStr, e);
                    }
                    searchIndex = jsonEnd;
                } else {
                    searchIndex += marker.length;
                }
            }

            return actions;
        }

        async function executeAiAction(action) {
            // Execute an ACTION command via /api/execute_task
            const settings = getSettings();
            const candidateUrls = [
                `${settings.apiBase}/api/execute_task`,
                "http://localhost:8000/api/execute_task",
                "http://localhost:8001/api/execute_task"
            ];

            const term = document.getElementById("terminalPanel");
            if (term) {
                term.innerHTML += `<div class="terminal-log-line cmd">&gt; [ACTION] ${escapeHtml(action.type)}/${escapeHtml(action.action)}: ${escapeHtml(action.path || action.language || '')}</div>`;
                term.scrollTop = term.scrollHeight;
            }

            let lastError = null;
            for (const apiUrl of candidateUrls) {
                try {
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(action)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            const detail = result.message || result.result || result.path || "OK";
                            if (term) {
                                term.innerHTML += `<div class="terminal-log-line" style="color:var(--accent-emerald);">&gt; SUCCESS: ${escapeHtml(String(detail))}</div>`;
                                term.scrollTop = term.scrollHeight;
                            }
                            return `Task completed: ${action.type}/${action.action} - ${detail}`;
                        } else {
                            if (term) {
                                term.innerHTML += `<div class="terminal-log-line err">&gt; ERROR: ${escapeHtml(String(result.error))}</div>`;
                                term.scrollTop = term.scrollHeight;
                            }
                            return `Task failed: ${action.type}/${action.action} - ${result.error}`;
                        }
                    }
                } catch (e) {
                    lastError = e;
                }
            }
            return `Task error: ${lastError ? lastError.message : "Backend unreachable"}`;
        }

            const pulse = document.getElementById("statusPulseDot");

            if (label) label.textContent = "PINGING...";

            try {
                const res = await fetch(`${settings.apiBase}/health`, { signal: AbortSignal.timeout(2000) });
                if (res.ok) {
                    state.backendStatus = "online";
                } else {
                    state.backendStatus = "standby";
                }
            } catch (e) {
                state.backendStatus = "standby";
            }

            updateStatusPill();
        }
